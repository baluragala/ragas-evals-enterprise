[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-evals"
version = "1.0.0"
description = "Enterprise-style LLM evaluation with Ragas and LangChain 1.x (teaching project)"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the OpenAI API (skipped when OPENAI_API_KEY is not set)"]
